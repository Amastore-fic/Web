# Pipeline de la web
#   CI (siempre): lint + build de tienda y panel en cada push y merge request.
#   CD (apagado): copia los builds al servidor cuando exista uno.
#                 Para activarlo: registrar un runner con la etiqueta "servidor" y crear la
#                 variable DEPLOY_HABILITADO=true en Settings > CI/CD > Variables.

# Un solo pipeline por cambio: en ramas con merge request abierto corre el del MR
workflow:
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH && $CI_OPEN_MERGE_REQUESTS'
      when: never
    - if: '$CI_COMMIT_BRANCH'

stages:
  - verificar
  - deploy

.ci_node:
  image: node:22-alpine
  stage: verificar
  script:
    - cd "$APP"
    - npm ci --no-audit --no-fund
    - npm run lint
    - npm run format:check
    - npm run build
  artifacts:
    paths:
      - $APP/dist/
    expire_in: 1 week

tienda:
  extends: .ci_node
  variables:
    APP: tienda
  cache:
    key:
      files: [tienda/package-lock.json]
    paths: [tienda/node_modules/]

panel:
  extends: .ci_node
  variables:
    APP: panel
  cache:
    key:
      files: [panel/package-lock.json]
    paths: [panel/node_modules/]

desplegar:
  stage: deploy
  tags:
    - servidor
  rules:
    - if: '$CI_COMMIT_BRANCH == "main" && $DEPLOY_HABILITADO == "true"'
  needs: [tienda, panel]
  script:
    - mkdir -p /srv/apps/comprasegura/tienda /srv/apps/comprasegura/panel
    - rsync -a --delete tienda/dist/ /srv/apps/comprasegura/tienda/dist/
    - rsync -a --delete panel/dist/ /srv/apps/comprasegura/panel/dist/
