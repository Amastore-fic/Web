server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Redirecciones relativas: conservan el puerto/dominio con el que entro el usuario
    absolute_redirect off;

    add_header X-Frame-Options "SAMEORIGIN";
    add_header X-Content-Type-Options "nosniff";

    # Archivos con hash en el nombre: se pueden cachear para siempre
    location ~* ^/(panel/)?assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Panel (React Router con basename /panel)
    location /panel/ {
        try_files $uri $uri/ /panel/index.html;
    }

    location = /panel {
        return 301 /panel/;
    }

    # Tienda (React Router): cualquier ruta desconocida carga la app
    location / {
        try_files $uri $uri/ /index.html;
    }
}
